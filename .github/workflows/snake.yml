name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake game from GitHub contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ayoitshasya
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?palette=github-dark

      # Pushes the generated files to a dedicated "output" branch.
      # Once this has run once, reference the raw URL from that branch in README.md,
      # replacing the assets/snake.gif placeholder — e.g.:
      # https://raw.githubusercontent.com/ayoitshasya/ayoitshasya/output/github-contribution-grid-snake.svg
      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
